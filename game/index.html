<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogo Clínico UC3 — Protótipo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #eef3f1;
    --surface: #ffffff;
    --surface-2: #f4f8f7;
    --border: #d3ded9;
    --border-strong: #b9c9c3;
    --ink: #16221f;
    --ink-muted: #55655e;
    --ink-faint: #8a9992;
    --accent: #0e7c66;
    --accent-ink: #0a5c4c;
    --accent-soft: #dceee8;
    --alert: #b9482f;
    --alert-soft: #f6e2db;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1614; --surface: #131c1a; --surface-2: #17211f;
      --border: #263330; --border-strong: #35443f;
      --ink: #e7efec; --ink-muted: #9db0aa; --ink-faint: #6d7f78;
      --accent: #4fd9b8; --accent-ink: #7ee8cd; --accent-soft: rgba(79,217,184,.12);
      --alert: #ff8a65; --alert-soft: rgba(255,138,101,.14);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1614; --surface: #131c1a; --surface-2: #17211f;
    --border: #263330; --border-strong: #35443f;
    --ink: #e7efec; --ink-muted: #9db0aa; --ink-faint: #6d7f78;
    --accent: #4fd9b8; --accent-ink: #7ee8cd; --accent-soft: rgba(79,217,184,.12);
    --alert: #ff8a65; --alert-soft: rgba(255,138,101,.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Serif", Georgia, serif; font-size: 16px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .sans { font-family: "IBM Plex Sans", system-ui, sans-serif; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  button { font: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .5; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { max-width: 800px; margin: 0 auto; padding: 28px 20px 64px; }

  /* game window chrome */
  .game-window {
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    background: var(--surface);
    box-shadow: 0 10px 30px rgba(10, 20, 18, 0.10);
    overflow: visible;
  }
  .window-bar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    border-radius: 12px 12px 0 0;
  }
  .window-dots { display: flex; gap: 5px; flex: none; }
  .window-dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--border-strong); display: block; }
  .window-title { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-muted); letter-spacing: .02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* HUD */
  .hud {
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    padding: 12px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  .pi-meter { display: flex; align-items: center; gap: 10px; }
  .pi-meter .pi-name { font-family: "IBM Plex Sans", sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-faint); }
  .pi-track { width: 140px; height: 9px; border-radius: 5px; background: var(--border); overflow: hidden; }
  .pi-fill { height: 100%; background: var(--accent); transition: width .25s ease, background .25s ease; }
  .pi-fill.low { background: var(--alert); }
  .pi-text { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .pi-text.low { color: var(--alert); }
  .hud-fase { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .05em; }

  /* scene */
  .scene {
    position: relative;
    padding: 24px 24px 160px;
    border-radius: 0 0 12px 12px;
    background:
      radial-gradient(ellipse 60% 50% at 88% 8%, var(--accent-soft), transparent 60%),
      var(--surface);
  }

  /* stepper */
  .stepper { display: flex; gap: 4px; margin-bottom: 24px; }
  .stepper .seg { flex: 1; height: 4px; border-radius: 2px; background: var(--border); }
  .stepper .seg.done { background: var(--accent); }
  .stepper .seg.now { background: var(--accent-ink); }

  h1.stage-title { font-family: "IBM Plex Sans", sans-serif; font-weight: 700; font-size: 22px; margin: 0 0 4px; letter-spacing: -.01em; }
  p.stage-kicker { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--accent-ink); margin: 0 0 6px; }
  p.stage-hint { color: var(--ink-muted); font-size: 14.5px; font-family: "IBM Plex Sans", sans-serif; max-width: 56ch; margin: 0 0 18px; }

  /* Burns pop-up: docked to the side of the game window, visual-novel style */
  .burns-pop {
    position: absolute;
    right: -14px;
    bottom: 14px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    max-width: min(360px, 90%);
    z-index: 5;
    animation: burnsPop .4s cubic-bezier(.2,.85,.35,1.25);
  }
  .burns-sprite {
    flex: none; width: 108px; height: 108px; border-radius: 50%; object-fit: cover;
    border: 3px solid var(--surface);
    box-shadow: 0 8px 20px rgba(10,20,18,.22), 0 0 0 1px var(--border-strong);
  }
  .bubble {
    position: relative;
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 48px;
    box-shadow: 0 6px 16px rgba(10,20,18,.12);
  }
  .bubble::after {
    content: ""; position: absolute; right: -7px; bottom: 24px;
    width: 13px; height: 13px; background: var(--surface);
    border-right: 1px solid var(--border-strong); border-bottom: 1px solid var(--border-strong);
    transform: rotate(-45deg);
  }
  .bubble .who { font-family: "IBM Plex Mono", monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-faint); margin: 0 0 4px; }
  .bubble p { font-family: "IBM Plex Sans", sans-serif; font-style: italic; font-size: 13.5px; line-height: 1.42; margin: 0; color: var(--ink); }

  @keyframes burnsPop {
    from { opacity: 0; transform: translate(26px, 14px) scale(.9); }
    to   { opacity: 1; transform: translate(0,0) scale(1); }
  }

  @media (max-width: 640px) {
    .scene { padding-bottom: 34px; }
    .burns-pop { position: static; margin: 22px 0 0; flex-direction: row-reverse; justify-content: flex-end; max-width: none; }
    .bubble { margin-bottom: 0; flex: 1; }
    .bubble::after { display: none; }
    .burns-sprite { width: 68px; height: 68px; }
  }

  .vitals { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px,1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
  .vital { background: var(--surface); padding: 9px 12px; }
  .vital .l { font-family: "IBM Plex Sans", sans-serif; font-size: 10px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .04em; }
  .vital .v { font-family: "IBM Plex Mono", monospace; font-size: 16px; font-weight: 500; margin-top: 2px; }
  .vital.flag .v { color: var(--alert); }

  blockquote.q { font-family: "IBM Plex Serif", serif; font-style: italic; border-left: 2px solid var(--border-strong); padding-left: 14px; margin: 0 0 20px; color: var(--ink); }

  .opts { list-style: none; margin: 0 0 20px; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .opt-btn {
    font-family: "IBM Plex Sans", sans-serif; font-size: 14px; text-align: left;
    width: 100%; border: 1px solid var(--border-strong); background: var(--surface);
    border-radius: 4px; padding: 10px 13px; color: var(--ink); display: flex;
    justify-content: space-between; align-items: center; gap: 10px;
  }
  .opt-btn:hover:not(:disabled) { border-color: var(--accent); }
  .opt-btn .cost { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--ink-faint); flex: none; }
  .opt-btn.picked { background: var(--accent-soft); border-color: var(--accent); }
  .opt-btn.picked .cost { color: var(--accent-ink); }
  .opt-btn .rank { font-family: "IBM Plex Mono", monospace; font-size: 11px; background: var(--accent); color: var(--surface); border-radius: 50%; width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; flex: none; margin-right: 8px; }

  .reveal { font-family: "IBM Plex Sans", sans-serif; font-size: 13px; color: var(--ink-muted); background: var(--surface-2); border: 1px solid var(--border); border-radius: 3px; padding: 8px 11px; margin: -2px 0 10px 2px; }

  .actions { display: flex; gap: 10px; margin-top: 22px; }
  .btn { font-family: "IBM Plex Sans", sans-serif; font-weight: 600; font-size: 14.5px; border-radius: 4px; padding: 11px 20px; border: 1px solid transparent; }
  .btn.primary { background: var(--accent); color: var(--surface); }
  .btn.primary:hover:not(:disabled) { background: var(--accent-ink); }
  .btn.ghost { background: transparent; border-color: var(--border-strong); color: var(--ink-muted); }

  .result-table { width: 100%; border-collapse: collapse; font-family: "IBM Plex Sans", sans-serif; font-size: 14px; margin-bottom: 22px; }
  .result-table td { padding: 8px 4px; border-bottom: 1px solid var(--border); }
  .result-table td:last-child { text-align: right; font-family: "IBM Plex Mono", monospace; }
  .result-table tr.total td { font-weight: 700; font-size: 16px; border-bottom: none; padding-top: 12px; }

  footer.note { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); font-family: "IBM Plex Sans", sans-serif; font-size: 12px; color: var(--ink-faint); }
</style>
</head>

const STAGES = ["intro","anamnese","exame","hipoteses","exames","diagnostico","conduta","resultado"];
let state = null;

function novoJogo() {
  state = {
    stageIdx: 0,
    pi: CASO.pi_inicial,
    anamnesePicked: [],
    examePicked: [],
    hipotesesPicked: [],
    examesPicked: [],
    diagnostico: null,
    conduta: null,
  };
  render();
}

function gastarPI(custo) {
  state.pi = Math.max(0, state.pi - custo);
}

function stepperHTML() {
  const jogaveis = STAGES.slice(0, -1); // sem "resultado"
  return `<div class="stepper">${jogaveis.map((s,i) => {
    let cls = "seg";
    if (i < state.stageIdx) cls += " done";
    else if (i === state.stageIdx) cls += " now";
    return `<div class="${cls}"></div>`;
  }).join("")}</div>`;
}

function hudHTML(stage) {
  const low = state.pi <= 20;
  const pct = Math.max(0, Math.min(100, (state.pi / CASO.pi_inicial) * 100));
  const faseNum = Math.min(STAGES.indexOf(stage) + 1, 6);
  return `
  <div class="hud">
    <div class="pi-meter">
      <span class="pi-name">PI</span>
      <div class="pi-track"><div class="pi-fill ${low ? "low" : ""}" style="width:${pct}%"></div></div>
      <span class="pi-text ${low ? "low" : ""}">${state.pi}/${CASO.pi_inicial}</span>
    </div>
    <div class="hud-fase">Fase ${faseNum}/6</div>
  </div>`;
}

/* Burns aparece em três momentos fixos: abertura, PI baixo, fechamento */
function burnsFor(stage) {
  if (stage === "intro") return { who: "abertura", texto: CASO.burns.abertura };
  if (stage === "exames" && state.pi <= 20) return { who: "orçamento baixo", texto: CASO.burns.piBaixo };
  if (stage === "resultado") return { who: "fechamento", texto: CASO.burns.fechamento };
  return null;
}

function burnsPopHTML(entry) {
  if (!entry) return "";
  return `
  <div class="burns-pop">
    <div class="bubble"><p class="who">Burns · ${entry.who}</p><p>“${entry.texto}”</p></div>
    <img class="burns-sprite" src="${BURNS_SRC}" alt="Burns">
  </div>`;
}

function vitalsHTML() {
  return `<div class="vitals">${CASO.sinais_vitais.map(v => `
    <div class="vital ${v.flag ? "flag" : ""}"><div class="l">${v.l}</div><div class="v">${v.v} <span style="font-size:10px;color:var(--ink-faint)">${v.u}</span></div></div>
  `).join("")}</div>`;
}

function render() {
  const app = document.getElementById("app");
  const stage = STAGES[state.stageIdx];
  app.innerHTML = `
    <div class="game-window">
      <div class="window-bar">
        <span class="window-dots"><i></i><i></i><i></i></span>
        <span class="window-title">🩺 Jogo Clínico UC3 — ${CASO.tema}</span>
      </div>
      ${hudHTML(stage)}
      <div class="scene">
        ${stage === "resultado" ? "" : stepperHTML()}
        ${renderStage(stage)}
        ${burnsPopHTML(burnsFor(stage))}
      </div>
    </div>`;
  wireStage(stage);
  window.scrollTo({top: 0, behavior: "instant"});
}

function renderStage(stage) {
  switch (stage) {
    case "intro": return `
      <p class="stage-kicker">Etapa 01 · Apresentação</p>
      <h1 class="stage-title">Paciente ${CASO.paciente.idade} anos, ${CASO.paciente.sexo === "M" ? "masculino" : "feminino"}</h1>
      <p class="stage-hint">Sem custo em PI — é o que já chega pronto quando o paciente entra na sala.</p>
      <blockquote class="q">${CASO.queixa_principal}</blockquote>
      ${vitalsHTML()}
      <div class="actions"><button class="btn primary" data-next>Iniciar anamnese</button></div>`;

    case "anamnese": return `
      <p class="stage-kicker">Etapa 02 · Anamnese dirigida</p>
      <h1 class="stage-title">O que você pergunta?</h1>
      <p class="stage-hint">Cada pergunta custa PI, relevante ou não. Escolha com critério.</p>
      <ul class="opts">${CASO.anamnese.map((q,i) => optRow(i, q.texto, q.custo, state.anamnesePicked.includes(i))).join("")}</ul>
      <div class="actions"><button class="btn primary" data-next>Ir pro exame físico</button></div>`;

    case "exame": return `
      <p class="stage-kicker">Etapa 03 · Exame físico</p>
      <h1 class="stage-title">O que você examina?</h1>
      <p class="stage-hint">Manobras e achados — mesmo custo em PI pras relevantes e pras distratoras.</p>
      <ul class="opts">${CASO.exameFisico.map((q,i) => optRow(i, q.texto, q.custo, state.examePicked.includes(i))).join("")}</ul>
      <div class="actions"><button class="btn primary" data-next>Formular hipóteses</button></div>`;

    case "hipoteses": return `
      <p class="stage-kicker">Etapa 04 · Hipóteses diagnósticas</p>
      <h1 class="stage-title">Até 3 suspeitas, em ordem</h1>
      <p class="stage-hint">Não custa PI — mas a ordem em que você escolhe define o placar. A primeira é sua principal suspeita.</p>
      <ul class="opts">${CASO.hipoteses.map((h,i) => rankRow(i, h.texto)).join("")}</ul>
      <div class="actions"><button class="btn primary" data-next ${state.hipotesesPicked.length===0?"disabled":""}>Pedir exames complementares</button></div>`;

    case "exames": return `
      <p class="stage-kicker">Etapa 05 · Exames complementares</p>
      <h1 class="stage-title">O que você solicita?</h1>
      <p class="stage-hint">Custo mais alto — pedir o exame errado gasta PI e não ajuda em nada.</p>
      <ul class="opts">${CASO.exames.map((q,i) => optRow(i, q.texto, q.custo, state.examesPicked.includes(i))).join("")}</ul>
      <div class="actions"><button class="btn primary" data-next>Fechar diagnóstico</button></div>`;

    case "diagnostico": return `
      <p class="stage-kicker">Etapa 06 · Diagnóstico final</p>
      <h1 class="stage-title">Qual é o diagnóstico?</h1>
      <p class="stage-hint">Decisão única — sem volta.</p>
      <ul class="opts">${CASO.hipoteses.map((h,i) => singleRow("diagnostico", i, h.texto, state.diagnostico===i)).join("")}</ul>
      <div class="actions"><button class="btn primary" data-next ${state.diagnostico===null?"disabled":""}>Definir conduta</button></div>`;

    case "conduta": return `
      <p class="stage-kicker">Etapa 06 · Conduta</p>
      <h1 class="stage-title">E agora, o que você faz?</h1>
      <p class="stage-hint">Última decisão do caso.</p>
      <ul class="opts">${CASO.condutas.map((c,i) => singleRow("conduta", i, c.texto, state.conduta===i)).join("")}</ul>
      <div class="actions"><button class="btn primary" data-next ${state.conduta===null?"disabled":""}>Ver resultado</button></div>`;

    case "resultado": return renderResultado();
  }
}

function optRow(i, texto, custo, picked) {
  return `<li><button class="opt-btn ${picked?"picked":""}" data-opt="${i}"><span>${texto}</span><span class="cost">${custo} PI</span></button>${picked ? `<div class="reveal">${revealFor(texto)}</div>` : ""}</li>`;
}

function revealFor(texto) {
  const all = [...CASO.anamnese, ...CASO.exameFisico, ...CASO.exames];
  const item = all.find(x => x.texto === texto);
  return item ? item.resposta : "";
}

function rankRow(i, texto) {
  const pos = state.hipotesesPicked.indexOf(i);
  const picked = pos !== -1;
  return `<li><button class="opt-btn ${picked?"picked":""}" data-rank="${i}">${picked ? `<span class="rank">${pos+1}</span>` : ""}<span style="flex:1">${texto}</span></button></li>`;
}

function singleRow(group, i, texto, picked) {
  return `<li><button class="opt-btn ${picked?"picked":""}" data-single="${group}:${i}">${texto}</button></li>`;
}

function wireStage(stage) {
  document.querySelectorAll("[data-opt]").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = +btn.dataset.opt;
      const listName = stage === "anamnese" ? "anamnesePicked" : stage === "exame" ? "examePicked" : "examesPicked";
      const src = stage === "anamnese" ? CASO.anamnese : stage === "exame" ? CASO.exameFisico : CASO.exames;
      const already = state[listName].includes(i);
      if (already) {
        state[listName] = state[listName].filter(x => x !== i);
        state.pi += src[i].custo;
      } else {
        if (state.pi < src[i].custo) return;
        state[listName].push(i);
        gastarPI(src[i].custo);
      }
      render();
    });
  });
  document.querySelectorAll("[data-rank]").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = +btn.dataset.rank;
      const pos = state.hipotesesPicked.indexOf(i);
      if (pos !== -1) state.hipotesesPicked.splice(pos, 1);
      else if (state.hipotesesPicked.length < 3) state.hipotesesPicked.push(i);
      render();
    });
  });
  document.querySelectorAll("[data-single]").forEach(btn => {
    btn.addEventListener("click", () => {
      const [group, iStr] = btn.dataset.single.split(":");
      state[group] = +iStr;
      render();
    });
  });
  const next = document.querySelector("[data-next]");
  if (next) next.addEventListener("click", () => { state.stageIdx++; render(); });
  const again = document.querySelector("[data-again]");
  if (again) again.addEventListener("click", novoJogo);
}

function renderResultado() {
  const diagCorretoIdx = CASO.hipoteses.findIndex(h => h.correta);
  const hipListaCerta = state.hipotesesPicked.includes(diagCorretoIdx);
  const hipPrimeiraCerta = state.hipotesesPicked[0] === diagCorretoIdx;
  const diagCerto = state.diagnostico === diagCorretoIdx;
  const condutaCerta = CASO.condutas[state.conduta]?.correta;

  const pts = {
    hip: hipListaCerta ? 30 : 0,
    hip1: hipPrimeiraCerta ? 20 : 0,
    diag: diagCerto ? 40 : 0,
    cond: condutaCerta ? 30 : 0,
    efic: state.pi,
  };
  const total = pts.hip + pts.hip1 + pts.diag + pts.cond + pts.efic;

  return `
    <p class="stage-kicker">Resultado</p>
    <h1 class="stage-title">${diagCerto ? "Diagnóstico correto" : "Não foi dessa vez"}</h1>
    <p class="stage-hint">O diagnóstico era <strong>${CASO.hipoteses[diagCorretoIdx].texto}</strong>.</p>
    <p style="font-family:'IBM Plex Sans',sans-serif;font-size:14.5px;color:var(--ink-muted)">${CASO.explicacao}</p>
    <table class="result-table">
      <tr><td>Hipótese correta listada</td><td>${hipListaCerta ? "+30" : "0"}</td></tr>
      <tr><td>Hipótese correta em 1º lugar</td><td>${hipPrimeiraCerta ? "+20" : "0"}</td></tr>
      <tr><td>Diagnóstico final correto</td><td>${diagCerto ? "+40" : "0"}</td></tr>
      <tr><td>Conduta correta</td><td>${condutaCerta ? "+30" : "0"}</td></tr>
      <tr><td>Eficiência (PI restante)</td><td>+${pts.efic}</td></tr>
      <tr class="total"><td>Total</td><td>${total} / 220</td></tr>
    </table>
    <div class="actions"><button class="btn primary" data-again>Jogar de novo</button></div>
  `;
}

novoJogo();
</script>
