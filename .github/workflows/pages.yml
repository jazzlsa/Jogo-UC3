name: pages

# Publica app/src/ (o jogo estático, sem servidor) no GitHub Pages a cada
# push na main — assim dá pra jogar no navegador (PC, celular, tablet)
# enquanto o jogo continua sendo desenvolvido, sem precisar instalar nada.
# Não depende do app/main.js (Electron) nem de tools/ (Python) — é só o
# HTML/CSS/JS/JSON de app/src/ direto.
on:
  push:
    branches: [main]
    paths:
      - "app/src/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/src

      - id: deployment
        uses: actions/deploy-pages@v4
