name: build-release

# Builda os três instaladores (Windows .exe, Mac .dmg/.zip, Android .apk) e
# sobe todos como assets de uma GitHub Release. Nenhum job aqui toca em
# Gemini/Sheets/NotebookLM — o app empacotado é 100% offline (ver tools/ pra
# geração de casos, que roda só localmente).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  desktop:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm ci

      - name: Buildar instalador (electron-builder)
        run: npm run dist

      - name: Upload dos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/*.zip
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Instalar dependências
        working-directory: mobile
        run: npm ci

      - name: Criar o projeto Android (Capacitor)
        working-directory: mobile
        run: npx cap add android

      - name: Sincronizar assets do jogo
        working-directory: mobile
        run: npx cap sync android

      - name: Decodificar a keystore de release
        working-directory: mobile
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > uc3-release.keystore

      - name: Buildar APK de release assinado
        working-directory: mobile/android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=../uc3-release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
